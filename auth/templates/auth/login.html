{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1 class="auth-title">
            Trainer Login
        </h1>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Username</label>

                <input type="text"
                    name="username"
                    class="form-control"
                    required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>

                <input type="password"
                    name="password"
                    class="form-control"
                    required>
            </div>

            <button type="submit"
                class="btn btn-warning w-100 auth-button">

                Login

            </button>

        </form>

    </div>

</div>

{% endblock %}

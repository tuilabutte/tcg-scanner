{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1 class="auth-title">
            Create Trainer Account
        </h1>

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input type="text"
                    name="username"
                    class="form-control"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Profile Picture
                </label>

                <input type="file"
                    name="profile_picture"
                    class="form-control"
                    accept="image/*">

            </div>

            <button type="submit"
                class="btn btn-warning w-100 auth-button">

                Register

            </button>

        </form>

    </div>

</div>

{% endblock %}

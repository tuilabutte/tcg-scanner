{% extends "base.html" %}

{% block title %}Trainers{% endblock %}

{% block content %}

<div class="container">

<div class="collection-header">

    <h1 class="collection-title">
        Trainers
    </h1>

    <p class="collection-subtitle">
        Browse all registered trainers.
    </p>

</div>

<div class="search-box mb-4">

    <input
        type="text"
        id="trainer-search"
        class="form-control"
        placeholder="Search trainers...">

</div>

<div
    id="search-results"
    class="row g-4">

</div>

</div>

{% endblock %}

{% block scripts %}

<script>

const searchInput =
    document.getElementById(
        "trainer-search"
    );

async function loadUsers(query = "") {

    const response =
        await fetch(
            `/api/search-users?q=${query}`
        );

    const users =
        await response.json();

    const results =
        document.getElementById(
            "search-results"
        );

    results.innerHTML = "";

    users.forEach(user => {

        results.innerHTML += `

        <div class="col-md-4 col-lg-3">

            <div class="pokemon-card">

                <img
                    src="/static/images/profiles/${user.profile_picture}"
                    class="profile-image">

                <h3>

                    ${user.username}

                </h3>

                <a
                    href="/profile/${user.id}"
                    class="btn btn-warning mt-3">

                    View Profile

                </a>

            </div>

        </div>

        `;

    });

}

loadUsers();

searchInput.addEventListener(
    "input",
    () => loadUsers(
        searchInput.value
    )
);

</script>

{% endblock %}
